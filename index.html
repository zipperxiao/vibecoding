<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>舒尔特方格</title>
  <style>
    :root{--bg:#edf3ee;--card:#fff;--ink:#193126;--muted:#63756c;--accent:#2d7560;--accent2:#54a487;--line:#dbe7df;--ok:#d9f2e5;--bad:#f9d8d0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f8fbf7,#e3eee7);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
    .app{width:min(640px,100%);margin:auto;padding:20px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:8px;width:44px;height:44px;border-radius:14px;background:var(--accent)}.logo i{background:#fff;border-radius:2px}.logo i:nth-child(5){background:#f3cf65}h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}.panel{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 40px #21493612}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#edf5ef;border-radius:15px;padding:11px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.label{font-size:13px;color:var(--muted);margin:16px 0 8px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice,.mode,.icon{border:0;background:#e9f1eb;color:var(--muted);border-radius:14px;padding:10px 13px;cursor:pointer}.choice.on,.mode.on{background:var(--accent);color:#fff}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{text-align:left;min-height:68px}.mode b{display:block;color:inherit;margin-bottom:5px}.mode small{color:inherit;opacity:.72}.primary{width:100%;height:56px;margin-top:18px;border:0;border-radius:17px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:17px;font-weight:700;cursor:pointer}.screen{display:none}.screen.show{display:block}.game-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.next{background:#e9f1eb;padding:8px 12px;border-radius:999px}.board{display:grid;gap:7px;width:min(100%,560px);aspect-ratio:1;margin:15px auto}.cell{border:1px solid var(--line);border-radius:15px;background:#fff;font-size:clamp(19px,6vw,34px);font-weight:800;cursor:pointer}.cell.done{opacity:.36}.cell.good{background:var(--ok)}.cell.bad{background:var(--bad)}.toolbar{display:flex;gap:8px}.secondary{flex:1;height:44px;border:0;background:transparent;color:var(--muted);cursor:pointer}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}.tab{border:0;background:transparent;color:var(--muted);padding:11px;cursor:pointer;border-radius:12px}.tab.active{background:#e1eee6;color:var(--accent);font-weight:700}.list{display:grid;gap:8px;margin-top:10px}.row{display:flex;justify-content:space-between;background:#edf5ef;border-radius:14px;padding:12px}.settings{display:grid;gap:4px}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.toggle{width:48px;height:28px;border:0;border-radius:20px;background:#cbd8d0;position:relative}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}.toggle.on{background:var(--accent)}.toggle.on:after{left:23px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#18312766;padding:18px}.modal-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:22px}.modal h2{margin-top:0}.countdown{position:fixed;inset:0;display:grid;place-items:center;background:#18312799;color:#fff;font-size:90px;font-weight:800;z-index:3}.empty{text-align:center;color:var(--muted);padding:26px}
    body.dark{--bg:#15231d;--card:#20342b;--ink:#edf7f0;--muted:#abc0b4;--line:#385148;--ok:#28533f;--bad:#60382f;background:var(--bg)}body.dark .panel{background:var(--card)}body.dark .stat,body.dark .choice,body.dark .mode,body.dark .next,body.dark .row,body.dark .tab.active{background:#294238}body.dark .cell{background:#294238;color:var(--ink)}
    :root{--accent:#267a67;--accent2:#62b798;--ink:#17362b;--muted:#6a8075;--line:#d8e7de}
    body{background:linear-gradient(145deg,#f6fbf7 0%,#e6f0e9 48%,#dcece5 100%);letter-spacing:.01em}
    .app{max-width:760px;padding:28px 20px 34px}
    .top{margin-bottom:20px;padding:0 4px}
    .brand{gap:14px}.logo{width:50px;height:50px;border-radius:17px;padding:9px;box-shadow:0 9px 22px #267a6730}.logo i:nth-child(5){background:#f1c861}
    h1{font-size:21px;letter-spacing:.04em}.top .icon{padding:10px 13px;background:#ffffffb8;color:var(--accent);box-shadow:0 5px 18px #21493612}
    .panel{border-radius:30px;padding:22px;background:#ffffffc9;box-shadow:0 22px 55px #21493614}
    #home{position:relative;overflow:hidden;padding:28px 22px 24px}#home:before{content:"DAILY FOCUS  /  01";display:block;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.18em;margin-bottom:12px}#home>.muted{font-size:15px;color:var(--ink);font-weight:600}
    .stats{gap:10px;margin:20px 0 22px}.stat{background:#f0f7f2;border:1px solid #e1eee5;padding:13px 8px}.stat b{font-size:20px;color:var(--ink)}
    .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted);margin:20px 0 10px}.choices{gap:9px}.choice{padding:10px 14px;background:#f0f6f1;border:1px solid #e1eee5;font-weight:600}.choice.on{background:var(--ink);border-color:var(--ink);box-shadow:0 7px 16px #17362b25}
    .modes{gap:10px}.mode{padding:14px;border:1px solid #e1eee5;background:#f0f6f1}.mode b{font-size:14px}.mode small{font-size:12px}.mode.on{background:linear-gradient(145deg,#327f6a,#236454);color:#fff;border-color:#327f6a;box-shadow:0 10px 22px #267a6730}.mode.on small{opacity:.8}
    .primary{height:60px;margin-top:22px;border-radius:19px;box-shadow:0 12px 25px #267a6740;letter-spacing:.08em}.primary:active{transform:translateY(1px);box-shadow:0 6px 15px #267a6730}
    #game{padding:20px 16px 18px}.game-head{padding:2px 6px 8px}.time{font-size:34px;letter-spacing:.04em}.next{background:#eaf5ee;border:1px solid #dcebe1;color:var(--muted)}.next b{color:var(--accent);font-size:18px;margin-left:3px}
    .board{gap:9px;margin:18px auto 20px;max-width:590px}.cell{border-radius:18px;background:#fbfefb;box-shadow:0 5px 12px #2149360b;font-size:clamp(20px,6vw,35px);transition:transform .12s,box-shadow .12s,background .12s}.cell:active{transform:scale(.94);box-shadow:inset 0 0 0 3px #62b798}.cell.good{background:var(--ok)}.cell.bad{background:var(--bad)}
    .toolbar{border-top:1px solid var(--line);padding-top:10px}.secondary{font-weight:600}
    .tabs{margin-top:18px;padding:5px;background:#ffffff9c;border:1px solid #ffffffcc;border-radius:17px;box-shadow:0 8px 24px #2149360c}.tab{padding:12px;border-radius:13px;font-weight:600}.tab.active{background:var(--ink);color:#fff;box-shadow:0 6px 14px #17362b24}
    .row{background:#f0f7f2;border:1px solid #e1eee5}.settings{padding:0 4px}.setting{font-weight:600}.modal{backdrop-filter:blur(8px)}.modal-card{border:1px solid var(--line);box-shadow:0 24px 60px #17362b2e}.countdown{backdrop-filter:blur(5px)}
    body.dark{background:#13221b}body.dark .top .icon{background:#294238}body.dark #home>.muted{color:var(--ink)}body.dark .stat,body.dark .choice,body.dark .mode{border-color:#385148}body.dark .choice.on,body.dark .tab.active{background:#62b798;color:#10251c}body.dark .panel{box-shadow:0 22px 55px #00000025}
    @media (max-width:520px){.app{padding:17px 12px 22px}.top{margin-bottom:14px}.panel{padding:18px;border-radius:25px}#home{padding:23px 17px}.stats{gap:6px}.stat{padding:11px 5px}.board{gap:6px}.cell{border-radius:13px}.tabs{margin-top:12px}}
    #countdown[hidden],#result[hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><h1>舒尔特方格</h1><div class="muted">看见数字，也看见专注</div></div></div><button class="icon" id="dark">夜间</button></header>
    <section class="panel screen show" id="home">
      <div class="muted">每天 3 分钟，让眼睛更会找。</div>
      <div class="stats"><div class="stat"><b id="today">0</b><span>今日训练</span></div><div class="stat"><b id="best">--</b><span>5×5 最佳</span></div><div class="stat"><b id="total">0</b><span>累计次数</span></div></div>
      <div class="label">方格大小</div><div class="choices" id="sizes"></div>
      <div class="label">训练方式</div><div class="modes" id="modes"></div>
      <button class="primary" id="start">开始训练</button>
    </section>
    <section class="panel screen" id="game"><div class="game-head"><div><div class="time" id="time">00:00.00</div><div class="muted" id="meta"></div></div><div class="next">下一个 <b id="next">1</b></div></div><div class="board" id="board"></div><div class="toolbar"><button class="secondary" id="stop">结束本局</button></div></section>
    <section class="panel screen" id="records"><div class="label">最佳成绩</div><div class="list" id="bests"></div><div class="label">最近训练</div><div class="list" id="history"></div></section>
    <section class="panel screen" id="settings"><div class="settings"><div class="setting">音效 <button class="toggle on" data-setting="sound"></button></div><div class="setting">手机震动 <button class="toggle on" data-setting="vibrate"></button></div><div class="setting">提示下一个格子 <button class="toggle" data-setting="hint"></button></div><div class="setting">夜间模式 <button class="toggle" data-setting="dark"></button></div></div></section>
    <nav class="tabs"><button class="tab active" data-screen="home">训练</button><button class="tab" data-screen="records">记录</button><button class="tab" data-screen="settings">设置</button></nav>
  </main>
  <div class="countdown" id="countdown" hidden>3</div>
  <div class="modal" id="result" hidden><div class="modal-card"><h2 id="resultTitle">完成</h2><p class="muted" id="resultCopy"></p><div class="stats"><div class="stat"><b id="resultTime">00:00.00</b><span>用时</span></div><div class="stat"><b id="resultErrors">0</b><span>点错</span></div></div><button class="primary" id="again">再来一局</button><button class="secondary" id="back">返回首页</button></div></div>
<script>
const modes=[['order','顺序寻数','从 1 点到最大'],['reverse','倒序寻数','从最大点回 1'],['color','色彩干扰','颜色会故意捣乱'],['flash','数字闪现','先看几秒再凭记忆']];
const store='schulte-v1', get=id=>document.getElementById(id), labels={3:'入门',4:'轻松',5:'经典',6:'进阶',7:'挑战',8:'极限'};
let d=JSON.parse(localStorage.getItem(store)||'{}'),size=d.size||5,mode=d.mode||'order',board=[],next=1,errors=0,running=false,startAt=0,raf=0,hidden=false;
d.history=d.history||[];d.best=d.best||{};d.total=d.total||0;d.settings=Object.assign({sound:true,vibrate:true,hint:false,dark:false},d.settings||{});d.days=d.days||{};
function save(){d.size=size;d.mode=mode;localStorage.setItem(store,JSON.stringify(d))}function dateKey(){let x=new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}function fmt(x){let m=Math.floor(x/60000),s=Math.floor(x%60000/1000),c=Math.floor(x%1000/10);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')}function shuffle(){let a=Array.from({length:size*size},(_,i)=>i+1);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('show',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='home')renderHome();if(id==='records')renderRecords();if(id==='settings')renderSettings()}
function renderHome(){get('today').textContent=d.days[dateKey()]||0;get('total').textContent=d.total;get('best').textContent=d.best['5-order']?fmt(d.best['5-order'].time):'--';get('sizes').innerHTML='';for(let n=3;n<=8;n++){let b=document.createElement('button');b.className='choice'+(n===size?' on':'');b.textContent=n+'×'+n+' '+labels[n];b.onclick=()=>{size=n;save();renderHome()};get('sizes').appendChild(b)}get('modes').innerHTML='';modes.forEach(x=>{let b=document.createElement('button');b.className='mode'+(x[0]===mode?' on':'');b.innerHTML='<b>'+x[1]+'</b><small>'+x[2]+'</small>';b.onclick=()=>{mode=x[0];save();renderHome()};get('modes').appendChild(b)})}
function renderRecords(){let ks=Object.keys(d.best);get('bests').innerHTML=ks.length?ks.map(k=>'<div class="row"><span>'+k.replace('-',' / ')+'</span><b>'+fmt(d.best[k].time)+'</b></div>').join(''):'<div class="empty">还没有成绩</div>';get('history').innerHTML=d.history.length?d.history.slice(0,10).map(x=>'<div class="row"><span>'+x.when+'<br>'+x.size+'×'+x.size+'</span><b>'+fmt(x.time)+'</b></div>').join(''):'<div class="empty">开始训练后会显示记录</div>'}
function renderSettings(){document.querySelectorAll('.toggle').forEach(x=>x.classList.toggle('on',!!d.settings[x.dataset.setting]));document.body.classList.toggle('dark',!!d.settings.dark)}
function paint(){let el=get('board');el.style.gridTemplateColumns='repeat('+size+',1fr)';el.innerHTML='';board.forEach(n=>{let b=document.createElement('button');b.className='cell';b.textContent=n;if(mode==='color')b.style.color='hsl('+n*47%360+' 70% 38%)';if(hidden)b.classList.add('hidden-num');if(d.settings.hint&&n===next&&!hidden)b.style.boxShadow='inset 0 0 0 3px #b8892d';if(mode==='reverse'?n>next:n<next)b.classList.add('done');b.onclick=()=>click(n,b);el.appendChild(b)});get('next').textContent=next>size*size?'✓':next;get('meta').textContent=size+'×'+size+' · '+modes.find(x=>x[0]===mode)[1]+' · 错 '+errors}
function click(n,b){if(!running)return;if(hidden){hidden=false;paint()}let target=mode==='reverse'?size*size:1;let ok=n===next;if(!ok){errors++;b.classList.add('bad');return}b.classList.add('good');next=mode==='reverse'?next-1:next+1;if((mode==='reverse'&&next<1)||(mode!=='reverse'&&next>size*size)){running=false;finish(Date.now()-startAt);return}paint()}
function clock(){if(!running)return;get('time').textContent=fmt(Date.now()-startAt);raf=requestAnimationFrame(clock)}function begin(){running=true;startAt=Date.now();clock();if(mode==='flash')setTimeout(()=>{if(running){hidden=true;paint()}},2200);paint()}
function start(){show('game');board=shuffle();next=mode==='reverse'?size*size:1;errors=0;hidden=false;get('time').textContent='00:00.00';paint();let c=get('countdown');c.hidden=false;let n=3;c.textContent=n;let t=setInterval(()=>{n--;if(n){c.textContent=n}else{clearInterval(t);c.hidden=true;begin()}},600)}
function finish(time){cancelAnimationFrame(raf);let r={size,mode,time,errors,when:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})};d.history.unshift(r);d.history=d.history.slice(0,50);d.total++;d.days[dateKey()]=(d.days[dateKey()]||0)+1;let k=size+'-'+mode;if(!d.best[k]||time<d.best[k].time)d.best[k]=r;save();get('resultTitle').textContent=errors?'练完了':'干净利落';get('resultCopy').textContent=errors?'点错 '+errors+' 次，继续保持。':'一个都没点错，节奏很好。';get('resultTime').textContent=fmt(time);get('resultErrors').textContent=errors;get('result').hidden=false}
function stop(){running=false;cancelAnimationFrame(raf);get('result').hidden=true;show('home')}
get('start').onclick=start;get('again').onclick=start;get('back').onclick=stop;get('stop').onclick=stop;get('dark').onclick=()=>{d.settings.dark=!d.settings.dark;save();renderSettings()};document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{if(running)stop();show(x.dataset.screen)});document.querySelectorAll('.toggle').forEach(x=>x.onclick=()=>{d.settings[x.dataset.setting]=!d.settings[x.dataset.setting];save();renderSettings()});renderSettings();renderHome();
</script>
</body>
</html>
